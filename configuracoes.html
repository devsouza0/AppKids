<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Configurações | Encanto Kids</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --bg:#080a0f;
    --sidebar:#0d1017;
    --card:#121722;
    --card2:#171d29;
    --border:#242b39;
    --text:#f5f7fa;
    --muted:#7f8999;
    --green:#22c55e;
    --blue:#3b82f6;
    --orange:#f59e0b;
    --red:#ef4444;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
}


/* SIDEBAR */

.sidebar{
    position:fixed;
    left:0;
    top:0;

    width:260px;
    height:100vh;

    background:var(--sidebar);

    border-right:1px solid var(--border);

    padding:24px 18px;

    display:flex;
    flex-direction:column;

    z-index:1000;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;

    padding:0 8px 25px;

    border-bottom:1px solid var(--border);
}

.logo-area img{
    width:52px;
    height:52px;

    border-radius:14px;

    object-fit:cover;
}

.logo-area h2{
    font-size:16px;
}

.logo-area p{
    font-size:11px;
    color:var(--muted);
    margin-top:4px;
}

.menu-title{
    font-size:10px;
    color:#555f70;

    margin:25px 10px 10px;

    font-weight:bold;
    letter-spacing:1.4px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu a{
    text-decoration:none;
    color:#8994a6;

    padding:13px 14px;

    display:flex;
    align-items:center;
    gap:13px;

    border-radius:10px;

    transition:.2s;
}

.menu a i{
    width:20px;
    text-align:center;
}

.menu a:hover{
    background:#171d28;
    color:white;
}

.menu a.active{
    background:white;
    color:#080a0f;
    font-weight:bold;
}

.sidebar-bottom{
    margin-top:auto;
}

.logout{
    width:100%;

    border:none;

    padding:13px;

    border-radius:10px;

    background:#191116;
    color:#ff6363;

    cursor:pointer;
    font-weight:bold;
}


/* MAIN */

.main{
    margin-left:260px;

    min-height:100vh;

    padding:30px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:20px;

    margin-bottom:25px;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.topbar h1{
    font-size:27px;
}

.topbar p{
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

.mobile-menu{
    display:none;

    width:42px;
    height:42px;

    border:1px solid var(--border);

    background:#151a24;
    color:white;

    border-radius:9px;

    cursor:pointer;
}


/* LAYOUT */

.settings-layout{
    display:grid;

    grid-template-columns:260px 1fr;

    gap:20px;
}

.settings-menu{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:15px;

    padding:12px;

    height:max-content;
}

.settings-menu button{
    width:100%;

    border:none;

    background:transparent;

    color:#8b96a8;

    padding:12px;

    border-radius:9px;

    cursor:pointer;

    text-align:left;

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:4px;
}

.settings-menu button:hover{
    background:#171d28;
    color:white;
}

.settings-menu button.active{
    background:white;
    color:#090b10;
    font-weight:bold;
}


/* PANEL */

.settings-panel{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:15px;

    overflow:hidden;
}

.panel-header{
    padding:20px;

    border-bottom:1px solid var(--border);
}

.panel-header h2{
    font-size:17px;
}

.panel-header p{
    color:#778296;

    font-size:10px;

    margin-top:5px;
}

.panel-body{
    padding:22px;
}


/* FORM */

.form-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;
}

.form-group{
    margin-bottom:14px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    display:block;

    color:#818c9f;

    font-size:9px;

    margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;

    background:#0d1118;

    color:white;

    border:1px solid #293243;

    border-radius:9px;

    outline:none;
}

.form-group input,
.form-group select{
    height:43px;

    padding:0 12px;
}

.form-group textarea{
    min-height:100px;

    padding:12px;

    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#4d5b73;
}


/* LOGO */

.logo-preview{
    width:140px;
    height:140px;

    border-radius:16px;

    background:#0d121a;

    border:1px solid #293243;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#687386;

    margin-top:8px;
}

.logo-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}


/* SAVE */

.save-area{
    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:20px;
}

.btn-primary{
    border:none;

    background:white;

    color:#090b10;

    padding:12px 17px;

    border-radius:10px;

    font-weight:bold;

    cursor:pointer;

    display:flex;

    align-items:center;

    gap:8px;
}

.btn-secondary{
    background:#1b2230;

    color:white;

    border:1px solid #30394a;

    padding:11px 14px;

    border-radius:9px;

    cursor:pointer;
}


/* SECTIONS */

.settings-section{
    display:none;
}

.settings-section.active{
    display:block;
}


/* TOAST */

.toast{
    position:fixed;

    right:25px;
    bottom:25px;

    width:310px;
    max-width:calc(100% - 40px);

    background:#151b25;

    border:1px solid #30394a;

    border-radius:12px;

    padding:14px;

    display:flex;

    gap:12px;

    opacity:0;

    transform:translateY(120px);

    transition:.35s;

    z-index:9000;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

.toast-icon{
    color:#4ade80;
    font-size:19px;
}

.toast.error .toast-icon{
    color:#f87171;
}

.toast strong{
    font-size:11px;
}

.toast p{
    color:#7d899c;
    font-size:9px;
    margin-top:4px;
}


/* MOBILE */

@media(max-width:900px){

    .sidebar{
        transform:translateX(-100%);
        transition:.3s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        padding:20px;
    }

    .mobile-menu{
        display:block;
    }

    .settings-layout{
        grid-template-columns:1fr;
    }

    .settings-menu{
        display:flex;
        overflow-x:auto;
    }

    .settings-menu button{
        min-width:160px;
        margin-bottom:0;
    }

}

@media(max-width:650px){

    .form-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<script>

/* =========================================
PROTEÇÃO
========================================= */

if(
    localStorage.getItem("adminLogado")
    !== "true"
){
    window.location.href =
    "login.html";
}


/* =========================================
VARIÁVEIS
========================================= */

let configuracaoAtualId = null;


/* =========================================
MENU MOBILE
========================================= */

function toggleMenu(){

    document
    .getElementById("sidebar")
    .classList
    .toggle("open");

}


/* =========================================
ABRIR SEÇÃO
========================================= */

function abrirSecao(
    secao,
    botao
){

    document
    .querySelectorAll(
        ".settings-section"
    )
    .forEach(
        item => {

            item.classList.remove(
                "active"
            );

        }
    );


    document
    .querySelectorAll(
        ".settings-menu button"
    )
    .forEach(
        item => {

            item.classList.remove(
                "active"
            );

        }
    );


    const elemento =
    document.getElementById(
        `secao-${secao}`
    );


    if(elemento){

        elemento
        .classList
        .add("active");

    }


    if(botao){

        botao
        .classList
        .add("active");

    }

}


/* =========================================
CARREGAR CONFIGURAÇÕES
========================================= */

async function carregarConfiguracoes(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("configuracoes")
        .select("*")
        .order(
            "id",
            {
                ascending:true
            }
        )
        .limit(1)
        .maybeSingle();


        if(error){
            throw error;
        }


        /*
        Se ainda não houver linha na tabela,
        deixamos os campos com valores padrão.
        */

        if(!data){

            configuracaoAtualId =
            null;


            preencherConfiguracoesPadrao();


            return;

        }


        configuracaoAtualId =
        data.id;


        document.getElementById(
            "nomeEmpresa"
        ).value =
        data.nome_empresa
        ||
        "Encanto Kids Infláveis";


        document.getElementById(
            "sloganEmpresa"
        ).value =
        data.slogan
        ||
        "A diversão que transforma sua festa!";


        document.getElementById(
            "cidadeEmpresa"
        ).value =
        data.cidade
        ||
        "";


        document.getElementById(
            "estadoEmpresa"
        ).value =
        data.estado
        ||
        "";


        document.getElementById(
            "logoEmpresa"
        ).value =
        data.logo_url
        ||
        "assets/logo.png";


        document.getElementById(
            "telefoneEmpresa"
        ).value =
        data.telefone
        ||
        "";


        document.getElementById(
            "instagramEmpresa"
        ).value =
        data.instagram
        ||
        "";


        document.getElementById(
            "enderecoEmpresa"
        ).value =
        data.endereco
        ||
        "";


        document.getElementById(
            "tipoPix"
        ).value =
        data.tipo_pix
        ||
        "";


        document.getElementById(
            "chavePix"
        ).value =
        data.chave_pix
        ||
        "";


        document.getElementById(
            "nomeRecebedor"
        ).value =
        data.nome_recebedor
        ||
        "";


        document.getElementById(
            "textoContrato"
        ).value =
        data.texto_contrato
        ||
        "";


        document.getElementById(
            "responsavelEmpresa"
        ).value =
        data.responsavel
        ||
        "";


        document.getElementById(
            "documentoResponsavel"
        ).value =
        data.documento_responsavel
        ||
        "";


        atualizarPreviewLogo();

    }
    catch(erro){

        console.error(
            "Erro ao carregar configurações:",
            erro
        );


        mostrarToast(
            "Erro",
            erro.message
            ||
            "Não foi possível carregar as configurações.",
            true
        );

    }

}


/* =========================================
PREENCHER PADRÃO
========================================= */

function preencherConfiguracoesPadrao(){

    document.getElementById(
        "nomeEmpresa"
    ).value =
    "Encanto Kids Infláveis";


    document.getElementById(
        "sloganEmpresa"
    ).value =
    "A diversão que transforma sua festa!";


    document.getElementById(
        "cidadeEmpresa"
    ).value =
    "";


    document.getElementById(
        "estadoEmpresa"
    ).value =
    "SP";


    document.getElementById(
        "logoEmpresa"
    ).value =
    "assets/logo.png";


    document.getElementById(
        "telefoneEmpresa"
    ).value =
    "";


    document.getElementById(
        "instagramEmpresa"
    ).value =
    "";


    document.getElementById(
        "enderecoEmpresa"
    ).value =
    "";


    document.getElementById(
        "tipoPix"
    ).value =
    "";


    document.getElementById(
        "chavePix"
    ).value =
    "";


    document.getElementById(
        "nomeRecebedor"
    ).value =
    "";


    document.getElementById(
        "textoContrato"
    ).value =
    "";


    document.getElementById(
        "responsavelEmpresa"
    ).value =
    "";


    document.getElementById(
        "documentoResponsavel"
    ).value =
    "";


    atualizarPreviewLogo();

}


/* =========================================
PREVIEW DA LOGO
========================================= */

function atualizarPreviewLogo(){

    const url =
    document.getElementById(
        "logoEmpresa"
    )
    .value
    .trim();


    const preview =
    document.getElementById(
        "logoPreview"
    );


    if(!url){

        preview.innerHTML = `

            <i class="fa-solid fa-image"></i>

        `;

        return;

    }


    preview.innerHTML = `

        <img
        src="${escapeHTMLConfiguracao(url)}"
        alt="Logo"
        onerror="mostrarErroLogo()">

    `;

}


/* =========================================
ERRO DA LOGO
========================================= */

function mostrarErroLogo(){

    document.getElementById(
        "logoPreview"
    ).innerHTML = `

        <i class="fa-solid fa-triangle-exclamation"></i>

    `;

}


/* =========================================
EVENTO DA LOGO
========================================= */

document.getElementById(
    "logoEmpresa"
)
.addEventListener(
    "input",
    atualizarPreviewLogo
);


/* =========================================
SALVAR CONFIGURAÇÕES
========================================= */

async function salvarConfiguracoes(){

    const nomeEmpresa =
    document.getElementById(
        "nomeEmpresa"
    )
    .value
    .trim();


    if(!nomeEmpresa){

        mostrarToast(
            "Atenção",
            "Informe o nome da empresa.",
            true
        );

        return;

    }


    const estado =
    document.getElementById(
        "estadoEmpresa"
    )
    .value
    .trim()
    .toUpperCase();


    if(
        estado
        &&
        estado.length !== 2
    ){

        mostrarToast(
            "Atenção",
            "Use a sigla do estado com 2 letras.",
            true
        );

        return;

    }


    const dados = {

        nome_empresa:
        nomeEmpresa,

        slogan:
        document.getElementById(
            "sloganEmpresa"
        )
        .value
        .trim(),

        telefone:
        document.getElementById(
            "telefoneEmpresa"
        )
        .value
        .trim(),

        instagram:
        document.getElementById(
            "instagramEmpresa"
        )
        .value
        .trim(),

        cidade:
        document.getElementById(
            "cidadeEmpresa"
        )
        .value
        .trim(),

        estado:
        estado,

        endereco:
        document.getElementById(
            "enderecoEmpresa"
        )
        .value
        .trim(),

        logo_url:
        document.getElementById(
            "logoEmpresa"
        )
        .value
        .trim(),

        tipo_pix:
        document.getElementById(
            "tipoPix"
        )
        .value,

        chave_pix:
        document.getElementById(
            "chavePix"
        )
        .value
        .trim(),

        nome_recebedor:
        document.getElementById(
            "nomeRecebedor"
        )
        .value
        .trim(),

        texto_contrato:
        document.getElementById(
            "textoContrato"
        )
        .value
        .trim(),

        responsavel:
        document.getElementById(
            "responsavelEmpresa"
        )
        .value
        .trim(),

        documento_responsavel:
        document.getElementById(
            "documentoResponsavel"
        )
        .value
        .trim(),

        updated_at:
        new Date()
        .toISOString()

    };


    const btn =
    document.getElementById(
        "btnSalvarConfiguracoes"
    );


    btn.disabled =
    true;


    btn.innerHTML = `

        <i class="fa-solid fa-spinner fa-spin"></i>

        Salvando...

    `;


    try{


        if(
            configuracaoAtualId
        ){

            const {
                error
            } =
            await supabaseClient
            .from("configuracoes")
            .update(
                dados
            )
            .eq(
                "id",
                configuracaoAtualId
            );


            if(error){
                throw error;
            }

        }
        else{

            const {
                data,
                error
            } =
            await supabaseClient
            .from("configuracoes")
            .insert(
                dados
            )
            .select()
            .single();


            if(error){
                throw error;
            }


            configuracaoAtualId =
            data.id;

        }


        mostrarToast(
            "Configurações salvas",
            "As informações da empresa foram atualizadas.",
            false
        );


        atualizarPreviewLogo();


    }
    catch(erro){

        console.error(
            "Erro ao salvar configurações:",
            erro
        );


        mostrarToast(
            "Erro ao salvar",
            erro.message
            ||
            "Não foi possível salvar as configurações.",
            true
        );

    }
    finally{

        btn.disabled =
        false;


        btn.innerHTML = `

            <i class="fa-solid fa-floppy-disk"></i>

            Salvar Configurações

        `;

    }

}


/* =========================================
ESCAPE HTML
========================================= */

function escapeHTMLConfiguracao(
    valor
){

    return String(
        valor ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
CONTINUA NA PARTE 3/4
========================================= */

</script>
<script>

/* =========================================
MÁSCARA SIMPLES DO TELEFONE
========================================= */

document.getElementById(
    "telefoneEmpresa"
)
.addEventListener(
    "input",
    function(){

        let valor =
        this.value
        .replace(
            /\D/g,
            ""
        )
        .slice(
            0,
            11
        );


        if(
            valor.length > 10
        ){

            valor =
            valor.replace(
                /^(\d{2})(\d{5})(\d{4})$/,
                "($1) $2-$3"
            );

        }
        else if(
            valor.length > 6
        ){

            valor =
            valor.replace(
                /^(\d{2})(\d{4})(\d{0,4})$/,
                "($1) $2-$3"
            );

        }
        else if(
            valor.length > 2
        ){

            valor =
            valor.replace(
                /^(\d{2})(\d+)/,
                "($1) $2"
            );

        }


        this.value =
        valor;

    }
);


/* =========================================
ESTADO EM MAIÚSCULO
========================================= */

document.getElementById(
    "estadoEmpresa"
)
.addEventListener(
    "input",
    function(){

        this.value =
        this.value
        .replace(
            /[^a-zA-Z]/g,
            ""
        )
        .toUpperCase()
        .slice(
            0,
            2
        );

    }
);


/* =========================================
INSTAGRAM
========================================= */

document.getElementById(
    "instagramEmpresa"
)
.addEventListener(
    "blur",
    function(){

        let valor =
        this.value
        .trim();


        if(
            valor
            &&
            !valor.startsWith("@")
            &&
            !valor.startsWith("http")
        ){

            valor =
            "@" + valor;

        }


        this.value =
        valor;

    }
);


/* =========================================
PIX - AJUSTAR PLACEHOLDER
========================================= */

document.getElementById(
    "tipoPix"
)
.addEventListener(
    "change",
    function(){

        const input =
        document.getElementById(
            "chavePix"
        );


        switch(
            this.value
        ){

            case "CPF":

                input.placeholder =
                "000.000.000-00";

            break;


            case "CNPJ":

                input.placeholder =
                "00.000.000/0000-00";

            break;


            case "Telefone":

                input.placeholder =
                "(19) 99999-9999";

            break;


            case "Email":

                input.placeholder =
                "financeiro@empresa.com";

            break;


            case "Aleatoria":

                input.placeholder =
                "Chave aleatória PIX";

            break;


            default:

                input.placeholder =
                "Informe a chave PIX";

        }

    }
);


/* =========================================
RESTAURAR CONFIGURAÇÕES
========================================= */

async function restaurarConfiguracoes(){

    const confirmar =
    confirm(
        "Deseja descartar as alterações ainda não salvas?"
    );


    if(!confirmar){
        return;
    }


    await carregarConfiguracoes();


    mostrarToast(
        "Restaurado",
        "Os dados salvos foram carregados novamente.",
        false
    );

}


/* =========================================
ALTERAR BOTÃO RESTAURAR
========================================= */

const botoesSecundarios =
document.querySelectorAll(
    ".save-area .btn-secondary"
);


if(
    botoesSecundarios.length > 0
){

    botoesSecundarios[0].onclick =
    restaurarConfiguracoes;

}


/* =========================================
SALVAR CTRL + S
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            (
                event.ctrlKey
                ||
                event.metaKey
            )
            &&
            event.key.toLowerCase()
            ===
            "s"
        ){

            event.preventDefault();

            salvarConfiguracoes();

        }

    }
);


/* =========================================
AVISO DE DADOS NÃO SALVOS
========================================= */

let configuracoesAlteradas =
false;


document
.querySelectorAll(
    ".settings-panel input, .settings-panel select, .settings-panel textarea"
)
.forEach(
    campo => {

        campo.addEventListener(
            "input",
            function(){

                configuracoesAlteradas =
                true;

            }
        );


        campo.addEventListener(
            "change",
            function(){

                configuracoesAlteradas =
                true;

            }
        );

    }
);


/* =========================================
MARCAR COMO SALVO
========================================= */

const salvarConfiguracoesOriginal =
salvarConfiguracoes;


salvarConfiguracoes =
async function(){

    await salvarConfiguracoesOriginal();

    configuracoesAlteradas =
    false;

};


/* =========================================
AVISO AO SAIR DA PÁGINA
========================================= */

window.addEventListener(
    "beforeunload",
    function(event){

        if(
            !configuracoesAlteradas
        ){
            return;
        }


        event.preventDefault();

        event.returnValue =
        "";

    }
);


/* =========================================
CONTINUA NA PARTE 4/4
========================================= */

</script>
<script>

/* =========================================
TOAST
========================================= */

let timerToastConfiguracoes = null;

function mostrarToast(
    titulo,
    texto,
    erro = false
){

    const toast =
    document.getElementById(
        "toast"
    );


    document.getElementById(
        "toastTitulo"
    ).textContent =
    titulo;


    document.getElementById(
        "toastTexto"
    ).textContent =
    texto;


    document.getElementById(
        "toastIcon"
    ).innerHTML =
    erro
    ?
    '<i class="fa-solid fa-circle-exclamation"></i>'
    :
    '<i class="fa-solid fa-circle-check"></i>';


    toast.classList.toggle(
        "error",
        erro
    );


    toast.classList.add(
        "show"
    );


    clearTimeout(
        timerToastConfiguracoes
    );


    timerToastConfiguracoes =
    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        3500
    );

}


/* =========================================
LOGOUT
========================================= */

function logout(){

    const confirmar =
    confirm(
        "Deseja realmente sair do painel?"
    );


    if(!confirmar){
        return;
    }


    localStorage.removeItem(
        "adminLogado"
    );


    localStorage.removeItem(
        "adminUsuario"
    );


    window.location.href =
    "login.html";

}


/* =========================================
MENU MOBILE
========================================= */

document
.querySelectorAll(
    ".sidebar .menu a"
)
.forEach(
    link => {

        link.addEventListener(
            "click",
            function(){

                document
                .getElementById(
                    "sidebar"
                )
                .classList
                .remove("open");

            }
        );

    }
);


/* =========================================
ESC
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key !==
            "Escape"
        ){
            return;
        }


        document
        .getElementById(
            "sidebar"
        )
        .classList
        .remove("open");

    }
);


/* =========================================
VERIFICAR SUPABASE
========================================= */

function verificarSupabaseConfiguracoes(){

    if(
        typeof supabaseClient ===
        "undefined"
    ){

        console.error(
            "supabaseClient não encontrado."
        );


        mostrarToast(
            "Erro de conexão",
            "Não foi possível conectar ao Supabase.",
            true
        );


        return false;

    }


    return true;

}


/* =========================================
APLICAR CONFIGURAÇÕES NO PAINEL
========================================= */

function aplicarConfiguracoesNoPainel(){

    const nome =
    document.getElementById(
        "nomeEmpresa"
    ).value
    .trim();


    const logo =
    document.getElementById(
        "logoEmpresa"
    ).value
    .trim();


    /*
    Nome da empresa na sidebar
    */

    document
    .querySelectorAll(
        ".logo-area h2"
    )
    .forEach(
        elemento => {

            if(nome){

                elemento.textContent =
                nome.replace(
                    " Infláveis",
                    ""
                );

            }

        }
    );


    /*
    Logo da sidebar
    */

    document
    .querySelectorAll(
        ".logo-area img"
    )
    .forEach(
        imagem => {

            if(logo){

                imagem.src =
                logo;

            }

        }
    );

}


/* =========================================
CARREGAR E APLICAR
========================================= */

async function carregarEAplicarConfiguracoes(){

    await carregarConfiguracoes();

    aplicarConfiguracoesNoPainel();

}


/* =========================================
ATUALIZAR APÓS SALVAR
========================================= */

const salvarConfiguracoesBase =
salvarConfiguracoes;


salvarConfiguracoes =
async function(){

    await salvarConfiguracoesBase();

    aplicarConfiguracoesNoPainel();

    configuracoesAlteradas =
    false;

};


/* =========================================
ATUALIZAR AO VOLTAR PARA A ABA
========================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            carregarConfiguracoes();

        }

    }
);


/* =========================================
INICIALIZAÇÃO
========================================= */

async function iniciarConfiguracoes(){

    console.log(
        "Iniciando Configurações..."
    );


    if(
        localStorage.getItem(
            "adminLogado"
        )
        !==
        "true"
    ){

        window.location.href =
        "login.html";

        return;

    }


    if(
        !verificarSupabaseConfiguracoes()
    ){

        return;

    }


    try{

        await carregarEAplicarConfiguracoes();


        configuracoesAlteradas =
        false;


        console.log(
            "Configurações carregadas com sucesso."
        );

    }
    catch(erro){

        console.error(
            "Erro ao iniciar configurações:",
            erro
        );


        mostrarToast(
            "Erro",
            erro.message
            ||
            "Não foi possível carregar as configurações.",
            true
        );

    }

}


/* =========================================
INICIAR
========================================= */

iniciarConfiguracoes();

</script>
