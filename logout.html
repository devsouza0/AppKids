<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saindo | Encanto Kids</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#080a0f;
    color:white;
    overflow:hidden;
}

.logout-box{
    text-align:center;
    animation:entrada .6s ease;
}

.logo{
    width:85px;
    height:85px;
    margin:0 auto 25px;
    border-radius:22px;
    background:#151b25;
    border:1px solid #293243;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    animation:pulse 1.5s infinite;
}

h1{
    font-size:30px;
    margin-bottom:10px;
}

p{
    color:#7f8999;
    font-size:14px;
}

.loader{
    width:180px;
    height:4px;
    background:#1b2230;
    border-radius:10px;
    margin:28px auto 0;
    overflow:hidden;
}

.loader span{
    display:block;
    height:100%;
    width:0;
    background:white;
    animation:carregar 2.4s forwards;
}

@keyframes carregar{
    from{
        width:0;
    }

    to{
        width:100%;
    }
}

@keyframes entrada{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.06);
    }

}

</style>
</head>

<body>

<div class="logout-box">

    <div class="logo">
        🎈
    </div>

    <h1>
        Saindo...
    </h1>

    <p id="mensagem">
        Foi bom te ver novamente, Chefe.
    </p>

    <div class="loader">
        <span></span>
    </div>

</div>

<script>

const usuario =
localStorage.getItem("adminUsuario")
|| "Chefe";

document.getElementById(
    "mensagem"
).textContent =
`Foi bom te ver novamente, ${usuario}.`;

setTimeout(() => {

    localStorage.removeItem("adminLogado");
    localStorage.removeItem("adminUsuario");

    window.location.href =
    "login.html";

},2500);

</script>

</body>
</html>
