<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encanto Kids ADM</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#1c1c1c;
    padding:30px;
    border-radius:10px;
    width:300px;
}

input{
    width:100%;
    padding:10px;
    margin:5px 0 15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    cursor:pointer;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="box">
<h2>Encanto Kids ADM</h2>

<input type="text" id="usuario" placeholder="Usuário">
<input type="password" id="senha" placeholder="Senha">

<button onclick="login()">Entrar</button>

<p id="msg"></p>
</div>

<script>

const supabase = window.supabase.createClient(
'https://stnjpquafragqjwxyjza.supabase.co',
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0bmpwcXVhZnJhZ3Fqd3h5anphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MzI2MzAsImV4cCI6MjEwMDUwODYzMH0.r3YlozqWb2h96TLomC-VOfeQNLknio8x5xaiNVlQOkE'
);

async function login(){

    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;

    const { data, error } = await supabase
    .from('administradores')
    .select('*')
    .eq('usuario', usuario)
    .eq('senha', senha)
    .single();

    if(error){
        document.getElementById('msg').innerText =
        'Erro: ' + error.message;
        return;
    }

    if(data){
        document.getElementById('msg').innerText =
        'LOGIN OK!';
    }else{
        document.getElementById('msg').innerText =
        'Usuário não encontrado';
    }

}
</script>

</body>
</html>
