<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Encanto Kids | Painel Administrativo</title>
    
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080a0f">
    
<!-- FAVICON -->
<link
rel="icon"
type="image/jpeg"
href="assets/favicon.jpeg">

<!-- FONT AWESOME -->
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at top right,
            #252525,
            transparent 40%
        ),
        #090909;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    color:#fff;

}


/* =========================================
CONTAINER
========================================= */

.login-container{

    width:100%;
    max-width:420px;

}


/* =========================================
CARD
========================================= */

.login-card{

    background:#141414;

    border:1px solid #292929;

    border-radius:20px;

    padding:35px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.55);

}


/* =========================================
MARCA
========================================= */

.marca{

    text-align:center;

    margin-bottom:30px;

}


.logo{

    width:90px;
    height:90px;

    object-fit:cover;

    border-radius:50%;

    border:3px solid #fff;

    margin-bottom:15px;

}


.marca h1{

    font-size:23px;

    margin-bottom:5px;

}


.marca p{

    color:#888;

    font-size:14px;

}


/* =========================================
CAMPOS
========================================= */

.campo{

    margin-bottom:18px;

}


.campo label{

    display:block;

    font-size:13px;

    color:#aaa;

    margin-bottom:7px;

}


.input-box{

    position:relative;

}


.campo input{

    width:100%;

    height:50px;

    background:#0c0c0c;

    color:white;

    border:1px solid #333;

    border-radius:10px;

    outline:none;

    padding:0 45px 0 15px;

    font-size:15px;

    transition:.2s;

}


.campo input:focus{

    border-color:#fff;

}


.campo input::placeholder{

    color:#555;

}


/* =========================================
MOSTRAR SENHA
========================================= */

.ver-senha{

    position:absolute;

    right:14px;

    top:50%;

    transform:translateY(-50%);

    border:none;

    background:transparent;

    color:#777;

    cursor:pointer;

    font-size:15px;

}


.ver-senha:hover{

    color:white;

}


/* =========================================
BOTÃO
========================================= */

.btn-login{

    width:100%;

    height:50px;

    border:0;

    border-radius:10px;

    background:white;

    color:black;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;

}


.btn-login:hover{

    transform:translateY(-2px);

    background:#e9e9e9;

}


.btn-login:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

}


/* =========================================
MENSAGEM
========================================= */

#mensagem{

    display:none;

    margin-top:18px;

    padding:12px;

    border-radius:8px;

    font-size:14px;

    text-align:center;

}


.erro{

    display:block !important;

    background:rgba(239,68,68,.12);

    border:1px solid rgba(239,68,68,.4);

    color:#ff7979;

}


.sucesso{

    display:block !important;

    background:rgba(34,197,94,.12);

    border:1px solid rgba(34,197,94,.4);

    color:#6ee7a0;

}


/* =========================================
RODAPÉ
========================================= */

.rodape{

    text-align:center;

    color:#555;

    margin-top:20px;

    font-size:12px;

}


/* =========================================
TELA DE ENTRADA
========================================= */

.login-intro{

    position:fixed;

    inset:0;

    background:#090909;

    display:none;

    align-items:center;
    justify-content:center;

    z-index:9999;

    text-align:center;

    padding:20px;

}


.login-intro.show{

    display:flex;

}


.intro-content{

    animation:entrada .5s ease;

}


.intro-logo{

    width:95px;
    height:95px;

    object-fit:cover;

    border-radius:50%;

    border:3px solid white;

    margin-bottom:25px;

}


.intro-content h2{

    font-size:30px;

    margin-bottom:10px;

}


.intro-content p{

    color:#888;

    font-size:14px;

}


.loader{

    width:220px;

    height:4px;

    background:#222;

    border-radius:10px;

    margin:25px auto 0;

    overflow:hidden;

}


.loader-bar{

    height:100%;

    width:0;

    background:white;

    border-radius:10px;

    animation:carregar 2s forwards;

}


@keyframes carregar{

    from{
        width:0;
    }

    to{
        width:100%;
    }

}


@keyframes entrada{

    from{

        opacity:0;

        transform:
            translateY(10px)
            scale(.98);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================
RESPONSIVO
========================================= */

@media(max-width:500px){

    .login-card{

        padding:27px 22px;

    }

    .intro-content h2{

        font-size:25px;

    }

}

</style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="marca">


            <img
            src="assets/favicon.jpeg"
            alt="Encanto Kids"
            class="logo"
            onerror="this.src='assets/logo.png'">


            <h1>
                Encanto Kids Infláveis
            </h1>


            <p>
                Painel Administrativo
            </p>


        </div>


        <form id="formLogin">


            <div class="campo">


                <label for="usuario">

                    Usuário

                </label>


                <input
                type="text"
                id="usuario"
                autocomplete="username"
                placeholder="Digite seu usuário"
                required>


            </div>


            <div class="campo">


                <label for="senha">

                    Senha

                </label>


                <div class="input-box">


                    <input
                    type="password"
                    id="senha"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                    required>


                    <button
                    type="button"
                    class="ver-senha"
                    onclick="alternarSenha()">

                        <i
                        class="fa-solid fa-eye"
                        id="iconeSenha"></i>

                    </button>


                </div>


            </div>


            <button
            type="submit"
            class="btn-login"
            id="btnLogin">

                Entrar

            </button>


            <div id="mensagem"></div>


        </form>


    </div>


    <div class="rodape">

        Encanto Kids Infláveis • Sistema Administrativo

    </div>


</div>


<!-- =========================================
TELA DE ENTRADA
========================================= -->

<div
class="login-intro"
id="loginIntro">


    <div class="intro-content">


        <img
        src="assets/favicon.jpeg"
        alt="Encanto Kids"
        class="intro-logo"
        onerror="this.src='assets/logo.png'">


        <h2 id="introTitulo">

            Bem-vindo!

        </h2>


        <p>

            Login realizado! Abrindo painel...

        </p>


        <div class="loader">

            <div class="loader-bar"></div>

        </div>


    </div>


</div>


<!-- SUPABASE CONFIG -->
<script src="js/supabase.js"></script>


<script>

/* =========================================
MOSTRAR / ESCONDER SENHA
========================================= */

function alternarSenha(){

    const senha =
    document.getElementById(
        "senha"
    );


    const icone =
    document.getElementById(
        "iconeSenha"
    );


    if(
        senha.type === "password"
    ){

        senha.type =
        "text";


        icone.className =
        "fa-solid fa-eye-slash";

    }
    else{

        senha.type =
        "password";


        icone.className =
        "fa-solid fa-eye";

    }

}


/* =========================================
LOGIN
========================================= */

document
.getElementById(
    "formLogin"
)
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const usuario =
        document
        .getElementById(
            "usuario"
        )
        .value
        .trim();


        const senha =
        document
        .getElementById(
            "senha"
        )
        .value;


        const mensagem =
        document.getElementById(
            "mensagem"
        );


        const btn =
        document.getElementById(
            "btnLogin"
        );


        mensagem.style.display =
        "none";


        mensagem.className =
        "";


        btn.disabled =
        true;


        btn.innerHTML = `

            <i class="fa-solid fa-spinner fa-spin"></i>

            Entrando...

        `;


        try{


            if(
                typeof supabaseClient ===
                "undefined"
            ){

                throw new Error(
                    "Supabase não conectado."
                );

            }


            const {
                data,
                error
            } =
            await supabaseClient
            .from(
                "administradores"
            )
            .select("*")
            .eq(
                "usuario",
                usuario
            )
            .eq(
                "senha",
                senha
            )
            .maybeSingle();


            if(error){

                throw error;

            }


            if(!data){

                mensagem.textContent =
                "Usuário ou senha inválidos.";


                mensagem.className =
                "erro";


                return;

            }


            /* =================================
            LOGIN OK
            ================================= */


            localStorage.setItem(
                "adminLogado",
                "true"
            );


            localStorage.setItem(
                "adminUsuario",
                data.usuario || usuario
            );


            /* =================================
            TELA DE BOAS-VINDAS
            ================================= */


            const nome =
            data.usuario || usuario;


            document.getElementById(
                "introTitulo"
            ).textContent =
            `Bem-vindo, Sr. ${nome}`;


            document.getElementById(
                "loginIntro"
            )
            .classList
            .add(
                "show"
            );


            /* =================================
            ABRIR DASHBOARD
            ================================= */


            setTimeout(
                function(){

                    window.location.href =
                    "dashboard.html";

                },
                2100
            );


        }
        catch(erro){


            console.error(
                "Erro no login:",
                erro
            );


            mensagem.textContent =
            erro.message ||
            "Não foi possível realizar o login.";


            mensagem.className =
            "erro";


        }
        finally{


            btn.disabled =
            false;


            btn.innerHTML =
            "Entrar";


        }

    }
);

</script>

    <script>

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        async function(){

            try{

                const registro =
                await navigator
                .serviceWorker
                .register(
                    "./service-worker.js"
                );


                console.log(
                    "Encanto Kids APP registrado:",
                    registro.scope
                );

            }
            catch(erro){

                console.error(
                    "Erro ao registrar APP:",
                    erro
                );

            }

        }
    );

}

</script>

</body>

</html>
