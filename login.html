<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Encanto Kids ADM</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#111;
}

.login-box{
width:400px;
background:#1c1c1c;
padding:40px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.5);
}

.logo{
text-align:center;
color:#fff;
font-size:28px;
font-weight:bold;
margin-bottom:30px;
}

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
color:#fff;
margin-bottom:8px;
}

.input-group input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#fff;
font-size:16px;
}

.btn-login{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#fff;
color:#000;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.btn-login:hover{
transform:translateY(-2px);
}

.erro{
color:#ff4d4d;
margin-top:15px;
text-align:center;
display:none;
}
</style>
</head>
<body>

<div class="login-box">

<div class="logo">
🎈 Encanto Kids ADM
</div>

<div class="input-group">
<label>Usuário</label>
<input type="text" id="usuario">
</div>

<div class="input-group">
<label>Senha</label>
<input type="password" id="senha">
</div>

<button class="btn-login" onclick="login()">
Entrar
</button>

<div class="erro" id="erro">
Usuário ou senha inválidos
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabase = window.supabase.createClient(
'https://stnjpquafragqjwxyjza.supabase.co',
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0bmpwcXVhZnJhZ3Fqd3h5anphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MzI2MzAsImV4cCI6MjEwMDUwODYzMH0.r3YlozqWb2h96TLomC-VOfeQNLknio8x5xaiNVlQOkE'
);

async function login() {

    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;

    const { data, error } = await supabase
        .from('administradores')
        .select('*')
        .eq('usuario', usuario)
        .eq('senha', senha)
        .single();

    if (data) {
        localStorage.setItem('adminLogado', 'true');
        window.location.href = 'dashboard.html';
    } else {
        document.getElementById('erro').style.display = 'block';
    }
}

</script>

</body>
</html>
