<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Encanto Kids | Painel Administrativo</title>

<link
rel="icon"
type="image/jpeg"
href="assets/favicon.jpeg">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    color:white;

    background:
        linear-gradient(
            rgba(2,6,15,.58),
            rgba(2,6,15,.72)
        ),
        url("assets/login-bg.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    overflow:hidden;
}

body::before{
    content:"";

    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            transparent 20%,
            rgba(0,0,0,.45) 75%,
            rgba(0,0,0,.72) 100%
        );

    pointer-events:none;
}

.login-container{
    width:100%;
    max-width:460px;

    position:relative;

    z-index:2;
}

.login-card{
    width:100%;

    background:
        linear-gradient(
            145deg,
            rgba(9,16,29,.94),
            rgba(5,11,21,.97)
        );

    border:1px solid rgba(255,122,0,.35);

    border-radius:24px;

    padding:30px 34px 27px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.70),
        0 0 35px rgba(255,122,0,.08),
        inset 0 1px 0 rgba(255,255,255,.04);

    backdrop-filter:blur(14px);
}

.login-card::before{
    content:"";

    position:absolute;

    top:-100px;
    left:50%;

    width:360px;
    height:180px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(249,115,22,.16),
            transparent 68%
        );

    pointer-events:none;
}


/* ========================================
MARCA
======================================== */

.marca{
    position:relative;

    text-align:center;

    margin-bottom:30px;
}

.logo{
    width:78px;
    height:78px;

    object-fit:cover;
    border-radius:20px;

    margin-bottom:14px;
}
.marca h1{
    font-size:25px;

    margin-bottom:24px;

    font-weight:800;

    letter-spacing:-.5px;
}

.marca h1 span{
    color:#ff7a00;
}

.marca p{
    color:#a0a9b7;

    font-size:14px;

    line-height:1.6;
}

.marca p strong{
    color:#ff7a00;
}


/* ========================================
FORM
======================================== */

.campo{
    margin-bottom:19px;
}

.campo label{
    display:block;

    font-size:14px;

    color:#edf1f6;

    margin-bottom:8px;

    font-weight:600;
}

.input-box{
    position:relative;
}

.input-icon{
    position:absolute;

    left:0;
    top:0;

    width:58px;
    height:54px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ff7a00;

    font-size:18px;

    border-right:1px solid #313a4b;

    z-index:2;
}

.campo input{
    width:100%;
    height:54px;

    background:rgba(7,14,26,.85);

    color:white;

    border:1px solid #344055;

    border-radius:14px;

    outline:none;

    padding:0 52px 0 75px;

    font-size:15px;

    transition:.25s;

    box-shadow:
        inset 0 0 12px rgba(0,0,0,.18);
}

.campo input::placeholder{
    color:#6f7b8e;
}

.campo input:focus{
    border-color:#ff7a00;

    box-shadow:
        0 0 0 3px rgba(249,115,22,.10),
        0 0 20px rgba(249,115,22,.10);
}


/* ========================================
MOSTRAR SENHA
======================================== */

.toggle-senha{
    position:absolute;

    right:15px;
    top:50%;

    transform:translateY(-50%);

    width:35px;
    height:35px;

    border:none;

    background:transparent;

    color:#8995a8;

    cursor:pointer;

    font-size:16px;

    z-index:3;
}

.toggle-senha:hover{
    color:white;
}


/* ========================================
BOTÃO
======================================== */

.btn-login{
    width:100%;
    height:56px;

    margin-top:5px;

    border:0;

    border-radius:14px;

    background:
        linear-gradient(
            90deg,
            #f15a00,
            #ff8a00
        );

    color:white;

    font-size:16px;

    font-weight:800;

    letter-spacing:.3px;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 14px 30px rgba(249,115,22,.20),
        inset 0 1px 0 rgba(255,255,255,.25);
}

.btn-login:hover{
    transform:translateY(-2px);

    filter:brightness(1.07);

    box-shadow:
        0 18px 38px rgba(249,115,22,.28);
}

.btn-login:disabled{
    opacity:.65;

    cursor:not-allowed;

    transform:none;
}


/* ========================================
MENSAGEM
======================================== */

#mensagem{
    display:none;

    margin-top:17px;

    padding:12px 14px;

    border-radius:10px;

    font-size:12px;

    text-align:center;
}

.erro{
    display:block !important;

    background:rgba(239,68,68,.12);

    border:1px solid rgba(239,68,68,.35);

    color:#ff8c8c;
}

.sucesso{
    display:block !important;

    background:rgba(34,197,94,.12);

    border:1px solid rgba(34,197,94,.35);

    color:#68e49a;
}


/* ========================================
SEGURANÇA
======================================== */

.security{
    margin-top:25px;

    text-align:center;

    color:#6f7a8c;

    font-size:11px;
}

.security i{
    margin-right:6px;
}


/* ========================================
RODAPÉ
======================================== */

.rodape{
    text-align:center;

    color:#667185;

    margin-top:13px;

    font-size:10px;
}


/* ========================================
INTRO LOGIN
======================================== */

.login-intro{
    position:fixed;

    inset:0;

    background:#080d16;

    z-index:9999;

    display:none;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:20px;
}

.login-intro.show{
    display:flex;
}

.intro-content{
    animation:introIn .55s ease;
}

.intro-logo{
    width:100px;
    height:100px;

    border-radius:24px;

    object-fit:cover;

    margin-bottom:22px;

    box-shadow:
        0 0 45px rgba(249,115,22,.18);
}

.intro-content span{
    display:block;

    color:#ff7a00;

    font-size:11px;

    letter-spacing:2px;

    margin-bottom:8px;
}

.intro-content h2{
    font-size:34px;

    margin-bottom:10px;
}

.intro-content p{
    color:#7d899b;

    font-size:13px;
}

.intro-loader{
    width:230px;
    height:4px;

    background:#171e2a;

    border-radius:10px;

    margin:27px auto 0;

    overflow:hidden;
}

.intro-loader div{
    height:100%;

    width:0;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #f15a00,
            #ff9a19
        );

    animation:carregarIntro 2s forwards;
}


/* ========================================
ANIMAÇÕES
======================================== */

@keyframes entradaLogin{

    from{
        opacity:0;
        transform:translateY(18px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

@keyframes introIn{

    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

@keyframes carregarIntro{

    from{
        width:0;
    }

    to{
        width:100%;
    }

}


/* ========================================
RESPONSIVO
======================================== */

@media(max-width:650px){

    body{
        padding:15px;

        background-position:center;
    }

    .login-card{
        padding:32px 23px 27px;

        border-radius:23px;
    }

    .logo{
        width:90px;
        height:90px;
    }

    .marca h1{
        font-size:24px;
    }

    .marca p{
        font-size:12px;
    }

    .campo input{
        height:51px;
    }

    .input-icon{
        height:51px;
    }

}

</style>

</head>

<body>


<div class="login-container">


<div class="login-card">


    <div class="marca">

        <img
        src="assets/favicon.jpeg"
        alt="Encanto Kids"
        class="logo"
        onerror="this.src='assets/logo.png'">


        <h1>
            Encanto <span>Kids</span>
        </h1>


        <p>
            Bem-vindo de volta!<br>
            Faça login para acessar o
            <strong>painel administrativo.</strong>
        </p>

    </div>


    <form id="formLogin">


        <div class="campo">

            <label for="usuario">
                Usuário
            </label>


            <div class="input-box">

                <div class="input-icon">
                    <i class="fa-solid fa-user"></i>
                </div>


                <input
                type="text"
                id="usuario"
                autocomplete="username"
                placeholder="Digite seu usuário"
                required>

            </div>

        </div>


        <div class="campo">

            <label for="senha">
                Senha
            </label>


            <div class="input-box">

                <div class="input-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>


                <input
                type="password"
                id="senha"
                autocomplete="current-password"
                placeholder="Digite sua senha"
                required>


                <button
                type="button"
                class="toggle-senha"
                onclick="alternarSenha()">

                    <i
                    class="fa-solid fa-eye"
                    id="iconeSenha"></i>

                </button>

            </div>

        </div>


        <button
        type="submit"
        class="btn-login"
        id="btnLogin">

            ENTRAR

        </button>


        <div id="mensagem"></div>


    </form>


    <div class="security">

        <i class="fa-solid fa-shield-halved"></i>

        Acesso seguro e restrito

    </div>


    <div class="rodape">

        Encanto Kids Infláveis • Sistema Administrativo

    </div>


</div>


</div>


<!-- ========================================
INTRO
======================================== -->

<div
class="login-intro"
id="loginIntro">

    <div class="intro-content">


        <img
        src="assets/favicon.jpeg"
        class="intro-logo"
        alt="Encanto Kids">


        <span>
            ENCANTO KIDS ADM
        </span>


        <h2 id="introTitulo">
            Bem-vindo!
        </h2>


        <p>
            Login realizado! Abrindo painel...
        </p>


        <div class="intro-loader">

            <div></div>

        </div>


    </div>

</div>


<script src="js/supabase.js"></script>

<script>

/* ========================================
MOSTRAR / OCULTAR SENHA
======================================== */

function alternarSenha(){

    const senha =
    document.getElementById(
        "senha"
    );


    const icone =
    document.getElementById(
        "iconeSenha"
    );


    if(
        senha.type ===
        "password"
    ){

        senha.type =
        "text";


        icone.className =
        "fa-solid fa-eye-slash";

    }
    else{

        senha.type =
        "password";


        icone.className =
        "fa-solid fa-eye";

    }

}


/* ========================================
LOGIN
======================================== */

document
.getElementById(
    "formLogin"
)
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const usuario =
        document.getElementById(
            "usuario"
        )
        .value
        .trim();


        const senha =
        document.getElementById(
            "senha"
        )
        .value;


        const mensagem =
        document.getElementById(
            "mensagem"
        );


        const btn =
        document.getElementById(
            "btnLogin"
        );


        mensagem.style.display =
        "none";


        mensagem.className =
        "";


        btn.disabled =
        true;


        btn.innerHTML = `

            <i class="fa-solid fa-spinner fa-spin"></i>

            Entrando...

        `;


        try{


            const {
                data,
                error
            } =
            await supabaseClient
            .from(
                "administradores"
            )
            .select("*")
            .eq(
                "usuario",
                usuario
            )
            .eq(
                "senha",
                senha
            )
            .maybeSingle();


            if(error){

                throw error;

            }


            if(!data){

                mensagem.textContent =
                "Usuário ou senha inválidos.";


                mensagem.className =
                "erro";


                return;

            }


            /* SALVAR LOGIN */

            localStorage.setItem(
                "adminLogado",
                "true"
            );


            localStorage.setItem(
                "adminUsuario",
                data.usuario
                ||
                usuario
            );


            /* INTRO */

            document.getElementById(
                "introTitulo"
            ).textContent =
            `Bem-vindo, Sr. ${
                data.usuario || usuario
            }`;


            document.getElementById(
                "loginIntro"
            )
            .classList
            .add("show");


            setTimeout(
                function(){

                    window.location.href =
                    "dashboard.html";

                },
                2100
            );


        }
        catch(erro){

            console.error(
                "Erro login:",
                erro
            );


            mensagem.textContent =
            erro.message
            ||
            "Não foi possível realizar o login.";


            mensagem.className =
            "erro";

        }
        finally{

            btn.disabled =
            false;


            btn.innerHTML =
            "ENTRAR";

        }

    }
);

</script>

</body>
</html>
